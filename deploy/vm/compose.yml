# EcoFin API on the VM: Caddy (HTTPS, ports 80/443) in front of the API container.
# Lives in /opt/ecofin. Values come from /opt/ecofin/.env (API_IMAGE, API_DOMAIN)
# and /opt/ecofin/api.env (the API's own settings and secrets).
name: ecofin

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is not set in /opt/ecofin/.env}
    env_file: [api.env]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    expose: ["3001"]          # reachable only from Caddy, never published
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is not set in /opt/ecofin/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: keep this volume
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
