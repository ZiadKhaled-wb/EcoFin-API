name: Publish contracts

# Pushing a tag such as contracts-v0.1.0 publishes @ziadkhaled-wb/contracts to GitHub Packages (private).
on:
  push:
    tags: ['contracts-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@ziadkhaled-wb'
          cache: npm

      # The contracts are an npm workspace: nothing is installed from GitHub Packages here.
      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @ziadkhaled-wb/contracts

      - name: Test contracts
        run: npm run test -w @ziadkhaled-wb/contracts

      - name: Tag version must equal the package version
        run: |
          pkg_version=$(node -p "require('./packages/contracts/package.json').version")
          tag_version="${GITHUB_REF_NAME#contracts-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg_version" >&2
            exit 1
          fi

      # GitHub's built-in token (permissions: packages: write above); no secret needed.
      # The repo .npmrc reads ${NPM_TOKEN} and takes precedence over the .npmrc that
      # setup-node writes (NODE_AUTH_TOKEN), so both must carry the token.
      - name: Publish
        run: npm publish -w @ziadkhaled-wb/contracts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
