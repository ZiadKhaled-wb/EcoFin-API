name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration order check compares with the base branch

      # D39: new migrations must be numbered after the newest one on main (a hosted db push
      # refuses older-numbered ones). PR: against the target branch; push: against the previous commit.
      - name: Migration order check
        run: node scripts/check-migration-order.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The API imports the built package (packages/contracts/dist), so build it first.
      # typecheck, test and build also do this through their pre* hooks.
      - name: Build contracts
        run: npm run build:contracts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test (API and contracts)
        run: npm test

      # F05 / D19: every route needs a cross-shop case (src/test/cross-shop/cases.ts) or must be
      # public; this names any route without one.
      - name: Cross-shop route check
        run: npm run check:cross-shop

      # F06 / D19: every route needs exactly one access marker (requirePermission(key),
      # authenticatedOnly() or publicRoute()); this names any route without one.
      - name: Permission marker check
        run: npm run check:permissions

      # F07 / D19: every write route names the audit action it writes (or none, with a reason).
      - name: Audit registry check
        run: npm run check:audit

      - name: Build
        run: npm run build

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs

  # F02: the baseline builds an empty database, a second run changes nothing, the seeded super
  # admin works, and every SQL test in supabase/tests passes (TEST-1: found by a glob).
  # Local Supabase only: this job never links to or pushes to a real project.
  db:
    runs-on: ubuntu-latest
    env:
      DB_CONTAINER: supabase_db_ecofin-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # scripts/db-smoke.mjs and the concurrency proofs run on Node.
      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start local Supabase (applies migrations and seeds)
        run: supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor,realtime

      - name: Rebuild from zero
        run: supabase db reset

      - name: Running the migrations twice changes nothing
        run: |
          # pg_dump 17.6+ writes a random \restrict key on each run; drop those two lines.
          dump() {
            docker exec "$DB_CONTAINER" pg_dump -U postgres -d postgres --no-owner -N supabase_migrations \
              | grep -Ev '^[\](un)?restrict ' > "$1"
          }
          dump "$RUNNER_TEMP/before.sql"
          supabase migration up --local
          dump "$RUNNER_TEMP/after.sql"
          test -s "$RUNNER_TEMP/before.sql"
          diff "$RUNNER_TEMP/before.sql" "$RUNNER_TEMP/after.sql"
          echo "Second migration run: no changes ($(wc -l < "$RUNNER_TEMP/before.sql") dump lines)"

      - name: Seeded super admin can sign in and is a super admin
        run: |
          result=$(docker exec -i "$DB_CONTAINER" psql -X -q -At -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'password_ok=' || (encrypted_password = extensions.crypt('LocalDev-Only-2026!', encrypted_password))
          FROM auth.users WHERE email = 'superadmin@ecotech.test';
          BEGIN;
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claims', '{"sub":"f0000000-0000-0000-0000-000000000001","role":"authenticated"}', true) IS NULL;
          SELECT 'is_super_admin=' || app.is_super_admin();
          ROLLBACK;
          SQL
          )
          echo "$result"
          grep -qx 'password_ok=true' <<< "$result"
          grep -qx 'is_super_admin=true' <<< "$result"

      # TEST-1 (EC-128): EVERY file in supabase/tests/ runs, found by a glob, so a new SQL test can't be
      # left out (this also makes f14_files_test.sql run, EC-141). Each file runs inside
      # BEGIN ... ROLLBACK; all files run even if one fails, and the step fails if any did.
      - name: SQL tests (every file in supabase/tests)
        run: |
          shopt -s nullglob
          files=(supabase/tests/*.sql)
          test ${#files[@]} -gt 0
          failed=()
          for f in "${files[@]}"; do
            echo "::group::$f"
            if node scripts/db-smoke.mjs "$f"; then echo "ok: $f"; else failed+=("$f"); fi
            echo "::endgroup::"
          done
          echo "SQL test files: ${#files[@]}, failed: ${#failed[@]}"
          if [ ${#failed[@]} -gt 0 ]; then printf 'FAILED: %s\n' "${failed[@]}"; exit 1; fi

      # 100 parallel sales of the last 10 units, and 50 parallel requests with one idempotency key.
      - name: F10 ledger concurrency proof
        run: node scripts/db-ledger-proof.mjs

      # 1,000 concurrent document creations (pgbench from the db image) with rollbacks mixed in.
      - name: F11 numbering concurrency proof
        run: node scripts/db-numbering-proof.mjs

      # TEST-3: the real write functions race for the last unit and the last pound in a safe.
      - name: TEST-3 stock and cash concurrency proof
        run: node scripts/db-stock-cash-proof.mjs

      # F10: after everything above wrote to the database, every cache must still equal its ledger.
      - name: Ledger reconciliation after the SQL tests
        run: node scripts/db-reconcile.mjs

      - name: Stop database
        if: always()
        run: supabase stop --no-backup

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs

  # TEST-1 (EC-128): the RUN_INTEGRATION=1 suites (auth, sessions, cross-shop, audit, files, ...)
  # on a fresh local stack. The tests start the app themselves, in-process (supertest), so no
  # separate API server is needed. Local demo keys printed by the CLI for this stack, not secrets.
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # The integration tests need Auth, PostgREST, Kong, Storage and Mailpit, not just Postgres.
      - name: Start local Supabase (applies migrations and seeds)
        run: supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor,realtime

      - name: Fresh database (migrations + dev seed)
        run: supabase db reset

      - name: Integration tests (RUN_INTEGRATION=1 npm test)
        run: |
          status=$(supabase status -o json)
          field() { node -e 'console.log(JSON.parse(process.argv[1])[process.argv[2]])' "$status" "$1"; }
          export SUPABASE_URL="$(field API_URL)"
          export SUPABASE_ANON_KEY="$(field ANON_KEY)"
          export SUPABASE_SERVICE_ROLE_KEY="$(field SERVICE_ROLE_KEY)"
          export FRONTEND_URL=http://localhost:5173 RUN_INTEGRATION=1 LOG_LEVEL=error
          # Application invitations and password resets use local SMTP.
          export SMTP_URL=smtp://127.0.0.1:54325 MAIL_FROM='EcoFin CI <ci@ecotech.test>'
          export MAILPIT_URL="$(field MAILPIT_URL)"
          npm test

      # F10: after the integration suites wrote to the database, every cache must still equal its ledger.
      - name: Ledger reconciliation after the integration tests
        run: node scripts/db-reconcile.mjs

      - name: Stop database
        if: always()
        run: supabase stop --no-backup

      - name: TEST4 known failures
        if: always()
        run: node scripts/test4-known-failures.mjs
