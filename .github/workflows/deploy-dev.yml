name: Deploy (development)

# Every push to main that passes CI is deployed to the development VM.
# Run it by hand ("Run workflow") to rebuild main, or to roll back by giving an
# image tag that was deployed before (e.g. sha-1a2b3c4).
# Setup and secrets: docs/05-operations/deployment.md

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (rollback), e.g. sha-1a2b3c4. Leave empty to build and deploy main."
        required: false
        default: ""

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Database migrations
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Pinned like ci.yml (D9): `latest` needs a GitHub API lookup that can hit the rate limit
      # (deploy of eec41be failed that way once, 4 Oct), and the same CLI as CI and local.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Apply pending migrations (supabase/migrations)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Secret SUPABASE_DB_URL is not set in the 'development' environment"; exit 1; }
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  build:
    name: Build image
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecofin-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:development
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: |
            APP_RELEASE=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VM
    needs: [migrate, build]
    # Runs after a successful build, or alone for a rollback (migrate/build skipped).
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://${{ vars.API_DOMAIN }}/health
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve image
        id: img
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid image tag '$tag'"; exit 1; }
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecofin-api:$tag" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VM_SSH_KEY" && test -n "$VM_SSH_KNOWN_HOSTS" || { echo "::error::Secrets VM_SSH_KEY / VM_SSH_KNOWN_HOSTS are not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Release on the VM
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          IMAGE_REF: ${{ steps.img.outputs.ref }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$VM_HOST" || { echo "::error::Variable VM_HOST is not set"; exit 1; }
          # The deploy key is restricted to /usr/local/bin/ecofin-deploy on the VM.
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "deploy@$VM_HOST" "deploy $IMAGE_REF $GITHUB_ACTOR"

      - name: Smoke test over HTTPS
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "https://$API_DOMAIN/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::https://$API_DOMAIN/health did not answer"
          exit 1
